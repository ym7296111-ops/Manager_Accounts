name: E2E (Playwright)

on:
  # Feature branches are verified by their pull request. A branch push that also
  # has an open PR used to start a SECOND identical run of this workflow for the
  # same commit -- two `playwright install` downloads and two local Supabase
  # stacks racing for the same runner/CDN budget, which is what made the
  # Chromium download fail intermittently while the PR run of the same commit
  # passed. `main` is still covered after a merge, and a branch without a PR can
  # be checked with workflow_dispatch.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E has passed against the local Supabase stack; failures now fail this check.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        env:
          # The browser CDN is the flakiest dependency of this job: give a stalled
          # download more room before it is abandoned.
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          # Three attempts with a longer timeout than the old double fallback:
          # the failure mode is a slow or refused download, not a broken command.
          for attempt in 1 2 3; do
            echo "::group::playwright install --with-deps chromium (attempt ${attempt}/3)"
            if timeout --kill-after=10s 300s npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Playwright install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Playwright Chromium could not be installed after 3 attempts."
          exit 1

      # Skip Docker Hub authentication for fork PRs. Repository settings must
      # also withhold secrets from untrusted forks. Missing secrets stay anonymous.
      - name: Check Docker Hub credentials
        id: dockerhub_credentials
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$DOCKERHUB_USERNAME" || -n "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured together.'
            exit 1
          else
            echo '::notice::Docker Hub credentials unavailable; continuing with anonymous pulls.'
          fi

      - name: Log in to Docker Hub
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.dockerhub_credentials.outputs.available == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and local seed
        run: supabase db reset --local

      - name: Export ephemeral local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/supabase-e2e.env"
          supabase status --output env > "$status_file"
          set -a
          # This file is emitted by the local CLI; it contains only disposable local keys.
          source "$status_file"
          set +a

          {
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'VITE_SUPABASE_URL=%s\n' "$API_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
          } >> "$GITHUB_ENV"

          functions_env="${RUNNER_TEMP}/supabase-functions.env"
          {
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } > "$functions_env"
          chmod 600 "$functions_env"
          echo "SUPABASE_FUNCTIONS_ENV=${functions_env}" >> "$GITHUB_ENV"

      - name: Start local Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          nohup supabase functions serve --env-file "$SUPABASE_FUNCTIONS_ENV" \
            > "${RUNNER_TEMP}/supabase-functions.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/supabase-functions.pid"

          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              -H 'Content-Type: application/json' \
              --data '{}' \
              'http://127.0.0.1:54321/functions/v1/admin-set-password' || true)"
            if [ "$status" = '401' ] || [ "$status" = '400' ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Local Supabase Edge Functions did not become ready.'
            cat "${RUNNER_TEMP}/supabase-functions.log" || true
            exit 1
          fi

      - name: Run Playwright E2E suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "${RUNNER_TEMP}/playwright-e2e.log"
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:5173

      - name: Add Playwright failure details to the job summary
        if: failure()
        shell: bash
        run: |
          {
            printf '### Playwright E2E failure output\n\n```text\n'
            grep -aA 40 -E '^\s+[0-9]+\) ' "${RUNNER_TEMP}/playwright-e2e.log" 2>/dev/null \
              | head -n 160 || true
            printf '\n--- last lines ---\n'
            tail -n 40 "${RUNNER_TEMP}/playwright-e2e.log" 2>/dev/null || true
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep a short diagnostic in the check annotations when log artifacts
          # cannot be fetched. Lead with the failing specs: the list reporter
          # prints every spec as it runs, so a plain tail of the log fills the
          # 3000-character budget with passes and cuts the failures off.
          details="$(
            {
              grep -aE '^\s+[0-9]+\) |^\s+✘|ℹ?\s*[0-9]+ (failed|flaky|did not run)|Error:|Expected|Received' \
                "${RUNNER_TEMP}/playwright-e2e.log" 2>/dev/null | head -n 20 || true
              printf '\n--- tail ---\n'
              tail -n 15 "${RUNNER_TEMP}/playwright-e2e.log" 2>/dev/null || true
            } \
            | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[redacted-email]/g' \
            | tr '\r\n' ' ' \
            | cut -c1-3000
          )"
          details="$(printf '%s' "$details" | sed 's/%/%25/g; s/::/%3A%3A/g')"
          printf '::error title=Playwright failure diagnostic::%s\n' "$details"

      - name: Upload Playwright report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Add successful visual evidence to the job summary
        if: success()
        shell: bash
        run: |
          {
            printf '### Playwright E2E evidence\n\n'
            printf 'The `playwright-e2e-evidence` artifact contains the HTML report and these successful workspace screenshots:\n\n'
            find test-results -type f -name 'workspace-*.png' -print | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
